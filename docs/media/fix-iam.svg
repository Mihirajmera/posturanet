<text x="18" y="654" class="t ln" style="animation-delay:3.98s"><tspan fill="#E8E6E1" font-weight="700">Result      </tspan><tspan fill="#4C6EF5">DRY RUN</tspan><tspan fill="#E8E6E1"> · risk medium · disruption none expected: every used action stays allowed · no AWS calls, no changes</tspan></text>
<text x="18" y="673" class="t ln" style="animation-delay:4.05s"><tspan fill="#E8E6E1" font-weight="700">Unknowns    </tspan><tspan fill="#E8E6E1">actions unused in IAM&#x27;s tracking period (about 400 days) are removed; rare jobs may need them</tspan></text>
<text x="18" y="692" class="t ln" style="animation-delay:4.12s"><tspan fill="#E8E6E1">            last-accessed data is per policy across all its principals; it can&#x27;t tell which principal needs which action</tspan></text>
<text x="18" y="711" class="t ln" style="animation-delay:4.19s"><tspan fill="#E8E6E1">            last-accessed data counts denied attempts as access, so kept actions may include some that another control (SCP, boundary, resource policy) already denies</tspan></text>
<text x="18" y="730" class="t ln" style="animation-delay:4.26s"><tspan fill="#E8E6E1">            owner: no CODEOWNERS rule matches the file</tspan></text>
<text x="18" y="749" class="t ln" style="animation-delay:4.33s"><tspan fill="#E8E6E1">            drift: not checked (needs terraform plan)</tspan></text>
