<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="420" viewBox="0 0 1060 420" role="img" aria-label="Where PosturaNet runs and what leaves your environment">
<title>Where PosturaNet runs and what leaves your environment</title>
<style>.f-bg{fill:#FFFFFF}.s-bg{stroke:#FFFFFF}.f-surf{fill:#F5F7F8}.s-surf{stroke:#F5F7F8}.f-bd{fill:#D9DEE2}.s-bd{stroke:#D9DEE2}.f-bds{fill:#B8C0C6}.s-bds{stroke:#B8C0C6}.f-tx{fill:#14202E}.s-tx{stroke:#14202E}.f-mu{fill:#5A6878}.s-mu{stroke:#5A6878}.f-acc{fill:#3B5BDB}.s-acc{stroke:#3B5BDB}.f-ok{fill:#1A7F37}.s-ok{stroke:#1A7F37}.f-warn{fill:#B35900}.s-warn{stroke:#B35900}.f-crit{fill:#C62828}.s-crit{stroke:#C62828}@media (prefers-color-scheme: dark){.f-bg{fill:#0B0E0F}.s-bg{stroke:#0B0E0F}.f-surf{fill:#1A1F1D}.s-surf{stroke:#1A1F1D}.f-bd{fill:#2A302E}.s-bd{stroke:#2A302E}.f-bds{fill:#3A423F}.s-bds{stroke:#3A423F}.f-tx{fill:#E8E6E1}.s-tx{stroke:#E8E6E1}.f-mu{fill:#919693}.s-mu{stroke:#919693}.f-acc{fill:#4C6EF5}.s-acc{stroke:#4C6EF5}.f-ok{fill:#2FBF71}.s-ok{stroke:#2FBF71}.f-warn{fill:#EAB308}.s-warn{stroke:#EAB308}.f-crit{fill:#E5484D}.s-crit{stroke:#E5484D}}.sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace}</style>
<defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-mu"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ok"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-warn"/></marker><marker id="a-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-crit"/></marker></defs>
<rect width="1060" height="420" rx="12" class="f-bg"/>
<rect x="24" y="20" width="1012" height="300" rx="10" class="f-bg s-bds" stroke-width="1.25" stroke-dasharray="6 5"/>
<text x="44.0" y="46.0" class="f-mu sans" font-size="11.5" text-anchor="start" font-weight="700">YOUR ENVIRONMENT: your cloud account, your CI, your GitHub</text>
<rect x="52" y="72" width="236" height="48" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="170.0" y="92.2" class="f-tx sans" font-size="13" text-anchor="middle" font-weight="700">Security Hub</text>
<text x="170.0" y="109.4" class="f-mu sans" font-size="11.5" text-anchor="middle">the finding (ASFF)</text>
<path d="M288.0,96.0 L364.0,96.0 L364.0,186.0 L386.0,186.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="52" y="132" width="236" height="48" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="170.0" y="152.2" class="f-tx sans" font-size="13" text-anchor="middle" font-weight="700">Terraform repo</text>
<text x="170.0" y="169.4" class="f-mu sans" font-size="11.5" text-anchor="middle">code, owners, state</text>
<path d="M288.0,156.0 L364.0,156.0 L364.0,186.0 L386.0,186.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="52" y="192" width="236" height="48" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="170.0" y="212.2" class="f-tx sans" font-size="13" text-anchor="middle" font-weight="700">read-only AWS role</text>
<text x="170.0" y="229.4" class="f-mu sans" font-size="11.5" text-anchor="middle">flow logs, CloudTrail, IAM usage</text>
<path d="M288.0,216.0 L364.0,216.0 L364.0,186.0 L386.0,186.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="52" y="252" width="236" height="48" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="170.0" y="272.2" class="f-tx sans" font-size="13" text-anchor="middle" font-weight="700">your LLM (optional)</text>
<text x="170.0" y="289.4" class="f-mu sans" font-size="11.5" text-anchor="middle">Bedrock or your own key</text>
<path d="M288.0,276.0 L364.0,276.0 L364.0,186.0 L386.0,186.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="388" y="108.0" width="284" height="156" rx="10" class="f-surf s-acc" stroke-width="1.75"/>
<text x="530.0" y="160.8" class="f-tx sans" font-size="15" text-anchor="middle" font-weight="700">PosturaNet agent</text>
<text x="530.0" y="179.3" class="f-mu sans" font-size="12" text-anchor="middle">in your CI or on a laptop</text>
<text x="530.0" y="190.3" class="f-mu sans" font-size="6" text-anchor="middle"></text>
<text x="530.0" y="205.4" class="f-ok sans" font-size="12" text-anchor="middle" font-weight="700">no writes to production</text>
<text x="530.0" y="222.8" class="f-mu sans" font-size="12" text-anchor="middle">the LLM explains; code decides</text>
<rect x="772" y="116.0" width="236" height="56" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="890.0" y="140.2" class="f-tx sans" font-size="13" text-anchor="middle" font-weight="700">GitHub pull request</text>
<text x="890.0" y="157.4" class="f-mu sans" font-size="11.5" text-anchor="middle">plus a check run; you merge</text>
<path d="M672.0,186.0 L748.0,186.0 L748.0,144.0 L770.0,144.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="772" y="200.0" width="236" height="56" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="890.0" y="224.2" class="f-tx sans" font-size="13" text-anchor="middle" font-weight="700">run record</text>
<text x="890.0" y="241.4" class="f-mu sans" font-size="11.5" text-anchor="middle">evidence files in the repo</text>
<path d="M672.0,186.0 L748.0,186.0 L748.0,228.0 L770.0,228.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="388" y="352" width="284" height="50" rx="10" class="f-surf s-bds" stroke-width="1.25"/>
<text x="530.0" y="373.2" class="f-tx sans" font-size="13" text-anchor="middle" font-weight="700">PosturaNet license service</text>
<text x="530.0" y="390.4" class="f-mu sans" font-size="11.5" text-anchor="middle">keys are checked offline</text>
<path d="M530.0,264.0 L530.0,350.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-mu)"/>
<text x="542.0" y="338.0" class="f-mu sans" font-size="11.5" text-anchor="start">optional heartbeat: license id + version only</text>
</svg>
