<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" viewBox="0 0 1060 400" role="img" aria-label="How PosturaNet turns a finding into a pull request">
<title>How PosturaNet turns a finding into a pull request</title>
<style>.f-bg{fill:#FFFFFF}.s-bg{stroke:#FFFFFF}.f-surf{fill:#F5F7F8}.s-surf{stroke:#F5F7F8}.f-bd{fill:#D9DEE2}.s-bd{stroke:#D9DEE2}.f-bds{fill:#B8C0C6}.s-bds{stroke:#B8C0C6}.f-tx{fill:#14202E}.s-tx{stroke:#14202E}.f-mu{fill:#5A6878}.s-mu{stroke:#5A6878}.f-acc{fill:#3B5BDB}.s-acc{stroke:#3B5BDB}.f-ok{fill:#1A7F37}.s-ok{stroke:#1A7F37}.f-warn{fill:#B35900}.s-warn{stroke:#B35900}.f-crit{fill:#C62828}.s-crit{stroke:#C62828}@media (prefers-color-scheme: dark){.f-bg{fill:#0B0E0F}.s-bg{stroke:#0B0E0F}.f-surf{fill:#1A1F1D}.s-surf{stroke:#1A1F1D}.f-bd{fill:#2A302E}.s-bd{stroke:#2A302E}.f-bds{fill:#3A423F}.s-bds{stroke:#3A423F}.f-tx{fill:#E8E6E1}.s-tx{stroke:#E8E6E1}.f-mu{fill:#919693}.s-mu{stroke:#919693}.f-acc{fill:#4C6EF5}.s-acc{stroke:#4C6EF5}.f-ok{fill:#2FBF71}.s-ok{stroke:#2FBF71}.f-warn{fill:#EAB308}.s-warn{stroke:#EAB308}.f-crit{fill:#E5484D}.s-crit{stroke:#E5484D}}.sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace}</style>
<defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-mu"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ok"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-warn"/></marker><marker id="a-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-crit"/></marker></defs>
<rect width="1060" height="400" rx="12" class="f-bg"/>
<rect x="38" y="24" width="160" height="32" rx="10" class="f-bg s-bds" stroke-width="1.25"/>
<text x="118.0" y="44.2" class="f-acc sans" font-size="12" text-anchor="middle" font-weight="700">Security Hub finding</text>
<path d="M118.0,56.0 L118.0,90.0" fill="none" class="s-acc" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-acc)"/>
<rect x="244" y="24" width="160" height="32" rx="10" class="f-bg s-bds" stroke-width="1.25"/>
<text x="324.0" y="44.2" class="f-acc sans" font-size="12" text-anchor="middle" font-weight="700">your Terraform repo</text>
<path d="M324.0,56.0 L324.0,90.0" fill="none" class="s-acc" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-acc)"/>
<rect x="450" y="24" width="160" height="32" rx="10" class="f-bg s-bds" stroke-width="1.25"/>
<text x="530.0" y="44.2" class="f-acc sans" font-size="12" text-anchor="middle" font-weight="700">logs, read-only role</text>
<path d="M530.0,56.0 L530.0,90.0" fill="none" class="s-acc" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-acc)"/>
<rect x="24" y="92" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="118.0" y="128.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">ingest</text>
<text x="118.0" y="146.7" class="f-mu sans" font-size="12" text-anchor="middle">the finding, parsed</text>
<text x="118.0" y="163.6" class="f-crit sans" font-size="11.5" text-anchor="middle">stops: unsupported control</text>
<path d="M212.0,140.0 L228.0,140.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="230" y="92" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="324.0" y="128.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">locate</text>
<text x="324.0" y="146.7" class="f-mu sans" font-size="12" text-anchor="middle">Terraform block + owner</text>
<text x="324.0" y="163.6" class="f-crit sans" font-size="11.5" text-anchor="middle">stops: no clear match</text>
<path d="M418.0,140.0 L434.0,140.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="436" y="92" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="530.0" y="128.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">evidence</text>
<text x="530.0" y="146.7" class="f-mu sans" font-size="12" text-anchor="middle">who really connects</text>
<text x="530.0" y="163.6" class="f-crit sans" font-size="11.5" text-anchor="middle">no logs: report only</text>
<path d="M624.0,140.0 L640.0,140.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="642" y="92" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="736.0" y="128.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">contract</text>
<text x="736.0" y="146.7" class="f-mu sans" font-size="12" text-anchor="middle">what must keep working</text>
<text x="736.0" y="163.6" class="f-crit sans" font-size="11.5" text-anchor="middle">stops: rare source unreviewed</text>
<path d="M830.0,140.0 L846.0,140.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="848" y="92" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="942.0" y="128.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">synthesize</text>
<text x="942.0" y="146.7" class="f-mu sans" font-size="12" text-anchor="middle">smallest fix (Z3)</text>
<text x="942.0" y="163.6" class="f-crit sans" font-size="11.5" text-anchor="middle">stops: nothing fits</text>
<rect x="848" y="236" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="942.0" y="272.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">validate</text>
<text x="942.0" y="290.7" class="f-mu sans" font-size="12" text-anchor="middle">plan scope + checks</text>
<text x="942.0" y="307.6" class="f-crit sans" font-size="11.5" text-anchor="middle">stops: any check fails</text>
<path d="M848.0,284.0 L832.0,284.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="642" y="236" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="736.0" y="272.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">deliver</text>
<text x="736.0" y="290.7" class="f-mu sans" font-size="12" text-anchor="middle">GitHub pull request</text>
<text x="736.0" y="307.6" class="f-crit sans" font-size="11.5" text-anchor="middle">stops: duplicate or freeze</text>
<path d="M642.0,284.0 L626.0,284.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="436" y="236" width="188" height="96" rx="10" class="f-bg s-acc" stroke-width="1.25" stroke-dasharray="6 5"/>
<text x="530.0" y="272.2" class="f-acc sans" font-size="15" text-anchor="middle" font-weight="700">you merge</text>
<text x="530.0" y="290.7" class="f-mu sans" font-size="12" text-anchor="middle">a person reviews it</text>
<text x="530.0" y="307.6" class="f-acc sans" font-size="11.5" text-anchor="middle">PosturaNet never merges</text>
<path d="M436.0,284.0 L420.0,284.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="230" y="236" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="324.0" y="272.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">verify</text>
<text x="324.0" y="290.7" class="f-mu sans" font-size="12" text-anchor="middle">re-check after apply</text>
<text x="324.0" y="307.6" class="f-warn sans" font-size="11.5" text-anchor="middle">regressed: revert PR</text>
<path d="M230.0,284.0 L214.0,284.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="24" y="236" width="188" height="96" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="118.0" y="272.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">record</text>
<text x="118.0" y="290.7" class="f-mu sans" font-size="12" text-anchor="middle">run record in the repo</text>
<text x="118.0" y="307.6" class="f-mu sans" font-size="11.5" text-anchor="middle">signed evidence (Pro)</text>
<path d="M942.0,188.0 L942.0,234.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="24" y="358" width="10" height="10" rx="2" class="f-crit"/>
<text x="42.0" y="368.0" class="f-mu sans" font-size="12.5" text-anchor="start">Every stop prints the reason and the next step, opens no PR and exits 3. When in doubt, PosturaNet stops.</text>
</svg>
