<svg xmlns="http://www.w3.org/2000/svg" width="800" height="374" viewBox="0 0 800 374" role="img" aria-label="An agent puts ec2:* back: the contract check blocks it">
<title>An agent puts ec2:* back: the contract check blocks it</title>
<style>
.t { font: 13.5px 'JetBrains Mono','Cascadia Mono',Consolas,monospace; white-space: pre; }
.ln { opacity: 0; animation: show .01s forwards; }
.type { transform-box: fill-box; transform-origin: right; animation: type 1.02s steps(34) forwards; }
@keyframes show { to { opacity: 1; } }
@keyframes type { to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .ln { opacity: 1; animation: none; } .type { display: none; } }
</style>
<rect width="800" height="374" rx="10" fill="#0B0E0F"/>
<rect width="800" height="34" rx="10" fill="#1A1F1D"/>
<rect y="24" width="800" height="10" fill="#1A1F1D"/>
<circle cx="20" cy="17" r="6" fill="#E5484D"/><circle cx="40" cy="17" r="6" fill="#EAB308"/><circle cx="60" cy="17" r="6" fill="#2FBF71"/>
<text x="400.0" y="22" text-anchor="middle" fill="#919693" style="font: 12px 'JetBrains Mono','Cascadia Mono',Consolas,monospace">An agent puts ec2:* back: the contract check blocks it</text>
<text x="18" y="65" class="t"><tspan fill="#2FBF71">$ </tspan><tspan fill="#E8E6E1">posturanet contract check --source</tspan></text>
<rect x="34.8" y="52" width="285.6" height="19" fill="#0B0E0F" class="type"/>
<text x="18" y="103" class="t ln" style="animation-delay:1.37s"><tspan fill="#919693">┌</tspan><tspan fill="#E8E6E1">  </tspan><tspan fill="#E8E6E1" font-weight="700">PosturaNet</tspan><tspan fill="#E8E6E1"> </tspan><tspan fill="#919693">0.2.0</tspan><tspan fill="#E8E6E1"> · contract check</tspan></text>
<text x="18" y="122" class="t ln" style="animation-delay:1.44s"><tspan fill="#919693">│</tspan></text>
<text x="18" y="141" class="t ln" style="animation-delay:1.51s"><tspan fill="#E5484D">●</tspan><tspan fill="#E8E6E1">  </tspan><tspan fill="#E5484D">BLOCK</tspan><tspan fill="#E8E6E1"> · this change would break 1 contract</tspan></text>
<text x="18" y="160" class="t ln" style="animation-delay:1.58s"><tspan fill="#919693">│</tspan></text>
<text x="18" y="179" class="t ln" style="animation-delay:1.65s"><tspan fill="#E5484D">◇</tspan><tspan fill="#E8E6E1">  </tspan><tspan fill="#E5484D" font-weight="700">✗</tspan><tspan fill="#E8E6E1"> aws_iam_policy.app</tspan><tspan fill="#E8E6E1"> </tspan><tspan fill="#919693">─────────────────────────────────────────────────────────────────╮</tspan></text>
<text x="18" y="198" class="t ln" style="animation-delay:1.72s"><tspan fill="#919693">│</tspan><tspan fill="#E8E6E1">                                                                                        </tspan><tspan fill="#919693">│</tspan></text>
<text x="18" y="217" class="t ln" style="animation-delay:1.79s"><tspan fill="#919693">│</tspan><tspan fill="#E8E6E1">  breaks must_allow: logs:CreateLogStream is no longer allowed (@example-org/platform)  </tspan><tspan fill="#919693">│</tspan></text>
<text x="18" y="236" class="t ln" style="animation-delay:1.86s"><tspan fill="#919693">│</tspan><tspan fill="#E8E6E1">  breaks must_remove: ec2:* is allowed again                                            </tspan><tspan fill="#919693">│</tspan></text>
<text x="18" y="255" class="t ln" style="animation-delay:1.93s"><tspan fill="#919693">│</tspan><tspan fill="#E8E6E1">  </tspan><tspan fill="#919693">caused by: planned policy in main.tf:1</tspan><tspan fill="#E8E6E1">                                                </tspan><tspan fill="#919693">│</tspan></text>
<text x="18" y="274" class="t ln" style="animation-delay:2.00s"><tspan fill="#919693">│</tspan><tspan fill="#E8E6E1">  </tspan><tspan fill="#4C6EF5">→</tspan><tspan fill="#E8E6E1"> keep the access, or update the contract in the same PR with owner approval          </tspan><tspan fill="#919693">│</tspan></text>
<text x="18" y="293" class="t ln" style="animation-delay:2.07s"><tspan fill="#919693">│</tspan><tspan fill="#E8E6E1">                                                                                        </tspan><tspan fill="#919693">│</tspan></text>
<text x="18" y="312" class="t ln" style="animation-delay:2.14s"><tspan fill="#919693">├────────────────────────────────────────────────────────────────────────────────────────╯</tspan></text>
<text x="18" y="331" class="t ln" style="animation-delay:2.21s"><tspan fill="#919693">│</tspan></text>
<text x="18" y="350" class="t ln" style="animation-delay:2.28s"><tspan fill="#919693">└</tspan><tspan fill="#E8E6E1">  Stopped. Fix the change or the contract first.</tspan></text>
</svg>
