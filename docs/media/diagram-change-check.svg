<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="392" viewBox="0 0 1060 392" role="img" aria-label="How PosturaNet checks a change made by a person or an AI agent">
<title>How PosturaNet checks a change made by a person or an AI agent</title>
<style>.f-bg{fill:#FFFFFF}.s-bg{stroke:#FFFFFF}.f-surf{fill:#F5F7F8}.s-surf{stroke:#F5F7F8}.f-bd{fill:#D9DEE2}.s-bd{stroke:#D9DEE2}.f-bds{fill:#B8C0C6}.s-bds{stroke:#B8C0C6}.f-tx{fill:#14202E}.s-tx{stroke:#14202E}.f-mu{fill:#5A6878}.s-mu{stroke:#5A6878}.f-acc{fill:#3B5BDB}.s-acc{stroke:#3B5BDB}.f-ok{fill:#1A7F37}.s-ok{stroke:#1A7F37}.f-warn{fill:#B35900}.s-warn{stroke:#B35900}.f-crit{fill:#C62828}.s-crit{stroke:#C62828}@media (prefers-color-scheme: dark){.f-bg{fill:#0B0E0F}.s-bg{stroke:#0B0E0F}.f-surf{fill:#1A1F1D}.s-surf{stroke:#1A1F1D}.f-bd{fill:#2A302E}.s-bd{stroke:#2A302E}.f-bds{fill:#3A423F}.s-bds{stroke:#3A423F}.f-tx{fill:#E8E6E1}.s-tx{stroke:#E8E6E1}.f-mu{fill:#919693}.s-mu{stroke:#919693}.f-acc{fill:#4C6EF5}.s-acc{stroke:#4C6EF5}.f-ok{fill:#2FBF71}.s-ok{stroke:#2FBF71}.f-warn{fill:#EAB308}.s-warn{stroke:#EAB308}.f-crit{fill:#E5484D}.s-crit{stroke:#E5484D}}.sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:'JetBrains Mono','Cascadia Mono',Consolas,monospace}</style>
<defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-mu"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-acc"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ok"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-warn"/></marker><marker id="a-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-crit"/></marker></defs>
<rect width="1060" height="392" rx="12" class="f-bg"/>
<rect x="24" y="106" width="200" height="132" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="124.0" y="149.3" class="f-tx sans" font-size="14" text-anchor="middle" font-weight="700">A person or</text>
<text x="124.0" y="169.6" class="f-tx sans" font-size="14" text-anchor="middle" font-weight="700">an AI coding agent</text>
<text x="124.0" y="187.8" class="f-mu sans" font-size="12" text-anchor="middle">edits a security group,</text>
<text x="124.0" y="205.2" class="f-mu sans" font-size="12" text-anchor="middle">S3 or IAM policy</text>
<rect x="268" y="32.0" width="236" height="64" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="386.0" y="60.0" class="f-tx sans" font-size="13.5" text-anchor="middle" font-weight="700">Claude Code hook</text>
<text x="386.0" y="78.0" class="f-mu sans" font-size="12" text-anchor="middle">after every .tf edit</text>
<path d="M224.0,172.0 L246.0,172.0 L246.0,64.0 L266.0,64.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="268" y="140.0" width="236" height="64" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="386.0" y="168.0" class="f-tx sans" font-size="13.5" text-anchor="middle" font-weight="700">MCP tool: check_change</text>
<text x="386.0" y="186.0" class="f-mu sans" font-size="12" text-anchor="middle">Cursor, Codex, Copilot, Gemini…</text>
<path d="M224.0,172.0 L246.0,172.0 L246.0,172.0 L266.0,172.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="268" y="248.0" width="236" height="64" rx="10" class="f-surf s-bd" stroke-width="1.25"/>
<text x="386.0" y="276.0" class="f-tx sans" font-size="13.5" text-anchor="middle" font-weight="700">CI check on the PR</text>
<text x="386.0" y="294.0" class="f-mu sans" font-size="12" text-anchor="middle">GitHub Action or any CI</text>
<path d="M224.0,172.0 L246.0,172.0 L246.0,280.0 L266.0,280.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<rect x="548" y="92" width="236" height="160" rx="10" class="f-surf s-acc" stroke-width="1.75"/>
<text x="666.0" y="140.2" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">posturanet</text>
<text x="666.0" y="162.0" class="f-tx mono" font-size="15" text-anchor="middle" font-weight="700">contract check</text>
<text x="666.0" y="180.5" class="f-mu sans" font-size="12" text-anchor="middle">the edited HCL or the plan</text>
<text x="666.0" y="197.9" class="f-mu mono" font-size="12" text-anchor="middle">vs posturanet/contracts/</text>
<text x="666.0" y="215.3" class="f-acc sans" font-size="12" text-anchor="middle">network · s3_public · iam</text>
<path d="M504.0,64.0 L526.0,64.0 L526.0,172.0 L546.0,172.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<path d="M504.0,172.0 L526.0,172.0 L526.0,172.0 L546.0,172.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<path d="M504.0,280.0 L526.0,280.0 L526.0,172.0 L546.0,172.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-mu)"/>
<path d="M784.0,172.0 L806.0,172.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M806.0,64.0 L806.0,280.0" fill="none" class="s-mu" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="828" y="32.0" width="208" height="64" rx="10" class="f-bg s-ok" stroke-width="1.75"/>
<text x="932.0" y="60.2" class="f-ok mono" font-size="14" text-anchor="middle" font-weight="700">PASS</text>
<text x="932.0" y="78.3" class="f-mu sans" font-size="12" text-anchor="middle">every contract line kept</text>
<path d="M806.0,64.0 L826.0,64.0" fill="none" class="s-ok" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-ok)"/>
<rect x="828" y="140.0" width="208" height="64" rx="10" class="f-bg s-warn" stroke-width="1.75"/>
<text x="932.0" y="168.2" class="f-warn mono" font-size="14" text-anchor="middle" font-weight="700">UNKNOWN · exit 3</text>
<text x="932.0" y="186.3" class="f-mu sans" font-size="12" text-anchor="middle">can&#x27;t judge: rerun with a plan</text>
<path d="M806.0,172.0 L826.0,172.0" fill="none" class="s-warn" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-warn)"/>
<rect x="828" y="248.0" width="208" height="64" rx="10" class="f-bg s-crit" stroke-width="1.75"/>
<text x="932.0" y="276.2" class="f-crit mono" font-size="14" text-anchor="middle" font-weight="700">BLOCK · exit 5</text>
<text x="932.0" y="294.3" class="f-mu sans" font-size="12" text-anchor="middle">breaks a contract line</text>
<path d="M806.0,280.0 L826.0,280.0" fill="none" class="s-crit" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a-crit)"/>
<path d="M932.0,312.0 L932.0,356.0 L124.0,356.0 L124.0,240.0" fill="none" class="s-crit" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-crit)"/>
<rect x="364" y="345" width="332" height="22" class="f-bg"/>
<text x="530.0" y="360.0" class="f-crit sans" font-size="12.5" text-anchor="middle">told which line it broke, so it fixes its own change</text>
</svg>
