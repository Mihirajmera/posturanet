# CI for the public PosturaNet repo (this folder is the repo root there).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Real terraform for the fmt integration test; the wrapper rewrites stdout/exit codes.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: python -m pip install -e ".[dev,mcp]"
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy src
      - run: pytest -q
      - run: shellcheck action/entrypoint.sh
      - name: Offline smoke run
        run: |
          posturanet fix tests/fixtures/findings/sg_ssh_open.json --dry-run \
            --repo tests/fixtures/tf/basic \
            --evidence-file tests/fixtures/flows/bastion_90d.json --ascii

  package:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          python -m pip install dist/*.whl
          posturanet --version
          posturanet init > /dev/null
