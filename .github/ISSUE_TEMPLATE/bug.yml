name: Bug
description: PosturaNet did something wrong, or stopped when it shouldn't have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Don't file it here: see SECURITY.md. Use synthetic data only: no real findings, account ids, state or logs."
  - type: input
    id: version
    attributes: { label: Version, description: "posturanet --version" }
    validations: { required: true }
  - type: input
    id: command
    attributes: { label: Command you ran }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "The output, with --format json if you can. Redact anything real." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: dropdown
    id: iac
    attributes:
      label: Infrastructure as code
      options: [Terraform, CloudFormation / SAM, CDK, Pulumi, Not relevant]
