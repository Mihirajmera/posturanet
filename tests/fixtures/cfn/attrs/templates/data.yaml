AWSTemplateFormatVersion: "2010-09-09"
Description: Synthetic data stack for PosturaNet attribute-fix tests.

Parameters:
  DbPassword:
    Type: String
    NoEcho: true

Resources:
  # Orders database. Owned by the payments team.
  OrdersDb:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: orders
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      MasterUsername: app
      MasterUserPassword: !Ref DbPassword
      DeletionProtection: "false" # flipped on by hand during the migration

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
