AWSTemplateFormatVersion: "2010-09-09"
Description: Synthetic network stack for PosturaNet tests (RFC 1918 / RFC 5737 only).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id

Resources:
  # Bastion host access. Opened "temporarily" in 2025.
  BastionSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} bastion"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH from anywhere
        # monitoring stays as it is
        - IpProtocol: tcp
          FromPort: 9100
          ToPort: 9100
          CidrIp: 10.0.0.0/16
          Description: node exporter
      Tags:
        - Key: Name
          Value: bastion

  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: web
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}

Outputs:
  BastionGroupId:
    Value: !GetAtt BastionSG.GroupId
